
name: Makhzani POS V8 - Windows Build

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build-windows:
    name: Build Makhzani POS V8
    runs-on: windows-latest
    timeout-minutes: 90

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.8.1
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Find or extract project
        shell: pwsh
        run: |
          $root = $env:GITHUB_WORKSPACE
          $project = $null

          $workspace = Get-ChildItem $root -Filter "pnpm-workspace.yaml" -Recurse -File |
            Where-Object { $_.FullName -notmatch '\\(node_modules|\.git)\\' } |
            Select-Object -First 1

          if ($workspace) {
            $project = $workspace.Directory.FullName
          }

          if (-not $project) {
            $zip = Get-ChildItem $root -Filter "*.zip" -File |
              Where-Object { $_.Name -like "*V8*" } |
              Select-Object -First 1

            if (-not $zip) {
              throw "لم يتم العثور على مجلد المشروع أو ملف ZIP V8"
            }

            $extract = Join-Path $env:RUNNER_TEMP "MakhzaniV8"
            New-Item -ItemType Directory -Force $extract | Out-Null
            Expand-Archive -Path $zip.FullName -DestinationPath $extract -Force

            $workspace = Get-ChildItem $extract -Filter "pnpm-workspace.yaml" -Recurse -File |
              Select-Object -First 1

            if ($workspace) {
              $project = $workspace.Directory.FullName
            }
          }

          if (-not $project -or -not (Test-Path (Join-Path $project "package.json"))) {
            throw "تعذر العثور على ملف package.json الرئيسي"
          }

          if (-not (Test-Path (Join-Path $project "artifacts/makhzani-pos/package.json"))) {
            throw "مجلد تطبيق مخزني غير موجود"
          }

          "PROJECT_DIR=$project" | Out-File $env:GITHUB_ENV -Append
          Write-Host "Project directory: $project"

      - name: Install dependencies
        shell: pwsh
        run: pnpm install --no-frozen-lockfile
        working-directory: ${{ env.PROJECT_DIR }}

      - name: Build Windows installer
        shell: pwsh
        run: pnpm --filter @workspace/makhzani-pos desktop:dist
        working-directory: ${{ env.PROJECT_DIR }}

      - name: Find EXE installer
        shell: pwsh
        run: |
          $project = $env:PROJECT_DIR

          $files = @(
            Get-ChildItem $project -Filter "*.exe" -Recurse -File |
            Where-Object {
              $_.FullName -notmatch '\\(node_modules|\.git)\\'
            }
          )

          if ($files.Count -eq 0) {
            Write-Host "لم يتم العثور على ملف EXE."
            Write-Host "مجلدات البناء:"
            Get-ChildItem $project -Directory -Recurse |
              Where-Object { $_.Name -match 'release|dist|win-unpacked' } |
              Select-Object -ExpandProperty FullName
            throw "لم يتم إنشاء ملف تثبيت Windows"
          }

          $output = Join-Path $env:GITHUB_WORKSPACE "installer-output"
          New-Item -ItemType Directory -Force $output | Out-Null

          foreach ($file in $files) {
            Copy-Item $file.FullName $output -Force
            Write-Host "Installer found: $($file.FullName)"
          }

      - name: Upload Windows installer
        uses: actions/upload-artifact@v4
        with:
          name: Makhzani-POS-V8-Windows
          path: installer-output/*.exe
          if-no-files-found: error
          retention-days: 30
