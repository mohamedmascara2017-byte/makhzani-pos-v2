
```yaml
name: Build Makhzani POS APK

"on":
  workflow_dispatch:
  push:
    paths:
      - '**.zip'
      - '.github/workflows/build-apk.yml'

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Enable pnpm
        run: |
          corepack enable
          corepack prepare pnpm@10.8.1 --activate

      - name: Find and extract project
        shell: bash
        run: |
          set -euo pipefail

          ZIP_FILE="$(find . -maxdepth 1 -type f -iname '*.zip' -print -quit)"

          if [ -z "$ZIP_FILE" ]; then
            echo "ERROR: No ZIP file found in the repository root."
            ls -lah
            exit 1
          fi

          echo "Using ZIP: $ZIP_FILE"
          mkdir -p project-unpacked
          unzip -q "$ZIP_FILE" -d project-unpacked

          WORKSPACE_FILE="$(find project-unpacked -name pnpm-workspace.yaml -print -quit)"

          if [ -z "$WORKSPACE_FILE" ]; then
            echo "ERROR: pnpm-workspace.yaml was not found inside the ZIP."
            find project-unpacked -maxdepth 4 -type f | head -100
            exit 1
          fi

          PROJECT_ROOT="$(dirname "$WORKSPACE_FILE")"
          APP_DIR="$PROJECT_ROOT/artifacts/makhzani-pos"

          if [ ! -f "$APP_DIR/package.json" ]; then
            echo "ERROR: Expo app package.json not found at $APP_DIR"
            find "$PROJECT_ROOT" -maxdepth 5 -name package.json
            exit 1
          fi

          echo "PROJECT_ROOT=$PROJECT_ROOT" >> "$GITHUB_ENV"
          echo "APP_DIR=$APP_DIR" >> "$GITHUB_ENV"

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile
        working-directory: ${{ env.PROJECT_ROOT }}

      - name: Generate Android project
        run: pnpm exec expo prebuild --platform android --no-install
        working-directory: ${{ env.APP_DIR }}

      - name: Build APK
        run: |
          set -e
          chmod +x gradlew
          ./gradlew assembleRelease
        working-directory: ${{ env.APP_DIR }}/android

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: makhzani-pos-apk
          path: ${{ env.APP_DIR }}/android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
```
