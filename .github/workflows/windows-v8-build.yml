
name: Build Makhzani POS Windows EXE

on:
  workflow_dispatch:
  push:
    paths:
      - '**'
      - '.github/workflows/build-windows.yml'

jobs:
  build:
    name: Build Windows Installer
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.8.1

      - name: Find and extract Makhzani project
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          function Find-DesktopApp($base) {
            $packages = Get-ChildItem -Path $base -Filter "package.json" -File -Recurse -ErrorAction SilentlyContinue |
              Where-Object { $_.FullName -notmatch '[\\/](node_modules|\.git)[\\/]' }

            foreach ($file in $packages) {
              try {
                $pkg = Get-Content $file.FullName -Raw | ConvertFrom-Json
                $script = $pkg.scripts.PSObject.Properties['desktop:dist']

                if ($null -ne $script) {
                  return [PSCustomObject]@{
                    AppDir = $file.Directory.FullName
                    Package = $file.FullName
                  }
                }
              } catch {}
            }

            return $null
          }

          $app = Find-DesktopApp $env:GITHUB_WORKSPACE

          if ($null -eq $app) {
            $zips = Get-ChildItem $env:GITHUB_WORKSPACE -Filter "*.zip" -File -Recurse |
              Where-Object { $_.FullName -notmatch '[\\/](node_modules|\.git)[\\/]' }

            foreach ($zip in $zips) {
              $destination = Join-Path $env:RUNNER_TEMP ("makhzani-" + [guid]::NewGuid().ToString("N"))
              New-Item -ItemType Directory -Path $destination -Force | Out-Null

              Write-Host "Checking archive: $($zip.Name)"
              Expand-Archive -LiteralPath $zip.FullName -DestinationPath $destination -Force

              $app = Find-DesktopApp $destination

              if ($null -ne $app) {
                Write-Host "Project found inside $($zip.Name)"
                break
              }
            }
          }

          if ($null -eq $app) {
            throw "Could not find a package.json containing the desktop:dist script. Check that the Windows project ZIP or source files are uploaded to the repository."
          }

          $appDir = $app.AppDir
          $workspaceRoot = $null
          $lockRoot = $null
          $current = Get-Item $appDir

          while ($null -ne $current) {
            if (Test-Path (Join-Path $current.FullName "pnpm-workspace.yaml")) {
              $workspaceRoot = $current.FullName
            }

            if ($null -eq $lockRoot -and (Test-Path (Join-Path $current.FullName "pnpm-lock.yaml"))) {
              $lockRoot = $current.FullName
            }

            $current = $current.Parent
          }

          if ([string]::IsNullOrWhiteSpace($workspaceRoot)) {
            $workspaceRoot = $lockRoot
          }

          if ([string]::IsNullOrWhiteSpace($workspaceRoot)) {
            $workspaceRoot = $appDir
          }

          Add-Content $env:GITHUB_ENV "BUILD_ROOT=$workspaceRoot"
          Add-Content $env:GITHUB_ENV "APP_DIR=$appDir"

          Write-Host "Workspace: $workspaceRoot"
          Write-Host "Application: $appDir"

      - name: Install dependencies
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          Set-Location $env:BUILD_ROOT

          if (Test-Path "pnpm-lock.yaml") {
            pnpm install --frozen-lockfile
          } else {
            pnpm install
          }

      - name: Build Windows EXE
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          Set-Location $env:APP_DIR
          pnpm run desktop:dist

      - name: Find generated EXE
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $output = Join-Path $env:GITHUB_WORKSPACE "windows-output"
          New-Item -ItemType Directory -Path $output -Force | Out-Null

          $files = Get-ChildItem -Path $env:APP_DIR -Filter "*.exe" -File -Recurse |
            Where-Object { $_.FullName -notmatch '[\\/](node_modules|\.git)[\\/]' }

          if (!$files) {
            throw "Build finished but no EXE file was found."
          }

          foreach ($file in $files) {
            Copy-Item $file.FullName -Destination $output -Force
            Write-Host "Found installer: $($file.Name)"
          }

      - name: Upload Windows Installer
        uses: actions/upload-artifact@v4
        with:
          name: Makhzani-POS-Windows-Installer
          path: windows-output/*.exe
          if-no-files-found: error
          retention-days: 14
