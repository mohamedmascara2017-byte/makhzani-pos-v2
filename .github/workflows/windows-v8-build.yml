
name: Build Makhzani POS V8.3 Windows EXE

on:
  workflow_dispatch:
  push:
    paths:
      - 'Makhzani_POS_V8_3_Updated.zip'
      - '.github/workflows/build-windows.yml'

permissions:
  contents: read

concurrency:
  group: makhzani-pos-windows
  cancel-in-progress: false

jobs:
  build-windows:
    runs-on: windows-latest
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.8.1
          run_install: false

      - name: Extract Makhzani POS V8.3
        shell: pwsh
        run: |
          if (!(Test-Path "Makhzani_POS_V8_3_Updated.zip")) {
            throw "Updated ZIP file not found!"
          }

          New-Item -ItemType Directory -Force -Path "project-unpacked" | Out-Null

          Expand-Archive `
            -Path "Makhzani_POS_V8_3_Updated.zip" `
            -DestinationPath "project-unpacked" `
            -Force

          if (!(Test-Path "project-unpacked/package.json")) {
            throw "Project package.json not found!"
          }

      - name: Install dependencies
        working-directory: project-unpacked
        shell: pwsh
        run: |
          pnpm install --no-frozen-lockfile

      - name: Build Windows EXE
        working-directory: project-unpacked
        shell: pwsh
        run: |
          pnpm --filter @workspace/makhzani-pos desktop:dist

      - name: Verify EXE
        shell: pwsh
        run: |
          $exe = Get-ChildItem `
            "project-unpacked/artifacts/makhzani-pos/release" `
            -Filter "*.exe" `
            -Recurse

          if (!$exe) {
            throw "Windows EXE was not generated!"
          }

          Write-Host "EXE successfully generated:"
          $exe | ForEach-Object { Write-Host $_.FullName }

      - name: Upload Windows Installer
        uses: actions/upload-artifact@v4
        with:
          name: Makhzani-POS-V8.3-Windows-Installer
          path: |
            project-unpacked/artifacts/makhzani-pos/release/*.exe
          if-no-files-found: error
          retention-days: 30
