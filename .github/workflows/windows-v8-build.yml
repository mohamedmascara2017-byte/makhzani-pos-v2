

name: Build Makhzani POS Windows EXE

on:
  workflow_dispatch:
  push:
    paths:
      - '**'
      - '.github/workflows/build-windows.yml'

jobs:
  build:
    name: Build Windows Installer
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.8.1

      - name: Verify project files
        shell: pwsh
        run: |
          if (!(Test-Path "package.json")) {
            throw "package.json not found in repository root"
          }
          if (!(Test-Path "pnpm-lock.yaml")) {
            throw "pnpm-lock.yaml not found in repository root"
          }
          if (!(Test-Path "artifacts/makhzani-pos/package.json")) {
            throw "Windows app package.json not found"
          }

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build Windows EXE
        working-directory: artifacts/makhzani-pos
        run: pnpm run desktop:dist

      - name: Verify EXE
        shell: pwsh
        run: |
          if (!(Test-Path "artifacts/makhzani-pos/release")) {
            throw "Release folder not found"
          }
          $exe = Get-ChildItem "artifacts/makhzani-pos/release" -Filter "*.exe" -Recurse
          if (!$exe) {
            throw "No Windows EXE was generated"
          }

      - name: Upload Windows Installer
        uses: actions/upload-artifact@v4
        with:
          name: Makhzani-POS-Windows-Installer
          path: artifacts/makhzani-pos/release/**/*.exe
          if-no-files-found: error
          retention-days: 14
