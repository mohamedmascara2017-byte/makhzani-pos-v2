
name: Build Makhzani POS V8.3 APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'Makhzani_POS_V8_3_Updated.zip'
      - '.github/workflows/build-apk.yml'

permissions:
  contents: read

concurrency:
  group: makhzani-pos-v83-apk
  cancel-in-progress: false

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    env:
      CI: 1
      EXPO_NO_TELEMETRY: 1
      GRADLE_OPTS: -Dorg.gradle.daemon=false -Dorg.gradle.caching=true

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: ''

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.8.1
          run_install: false

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Extract updated project
        shell: bash
        run: |
          if [ ! -f Makhzani_POS_V8_3_Updated.zip ]; then
            echo "Updated ZIP file not found!"
            exit 1
          fi

          mkdir -p project-unpacked
          unzip -q Makhzani_POS_V8_3_Updated.zip -d project-unpacked

      - name: Install dependencies
        working-directory: project-unpacked
        run: pnpm install --no-frozen-lockfile

      - name: Generate Android project
        working-directory: project-unpacked/artifacts/makhzani-pos
        run: pnpm exec expo prebuild --platform android --no-install --clean

      - name: Build Release APK
        working-directory: project-unpacked/artifacts/makhzani-pos/android
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Makhzani-POS-V8.3-APK
          path: project-unpacked/artifacts/makhzani-pos/android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 30
