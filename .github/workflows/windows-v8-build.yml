

name: Makhzani POS V8.1 - Windows Installer

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build-windows:
    name: Build Makhzani POS V8.1
    runs-on: windows-latest
    timeout-minutes: 90

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.8.1
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Find and extract V8.1 project
        shell: pwsh
        run: |
          $root = $env:GITHUB_WORKSPACE
          $project = $null

          $zip = Get-ChildItem $root -Filter "Makhzani_POS_V8_1_Barcode_Camera_Fix.zip" -File |
            Select-Object -First 1

          if ($zip) {
            $extract = Join-Path $env:RUNNER_TEMP "MakhzaniV81"
            New-Item -ItemType Directory -Force $extract | Out-Null
            Expand-Archive -Path $zip.FullName -DestinationPath $extract -Force

            $workspace = Get-ChildItem $extract -Filter "pnpm-workspace.yaml" -Recurse -File |
              Select-Object -First 1

            if ($workspace) {
              $project = $workspace.Directory.FullName
            }
          }

          if (-not $project) {
            $workspace = Get-ChildItem $root -Filter "pnpm-workspace.yaml" -Recurse -File |
              Where-Object { $_.FullName -notmatch '\\(node_modules|\.git|_temp)\\' } |
              Select-Object -First 1

            if ($workspace) {
              $project = $workspace.Directory.FullName
            }
          }

          if (-not $project -or -not (Test-Path (Join-Path $project "package.json"))) {
            throw "Project package.json not found."
          }

          $appPackage = Join-Path $project "artifacts/makhzani-pos/package.json"
          if (-not (Test-Path $appPackage)) {
            throw "Makhzani app package not found."
          }

          "PROJECT_DIR=$project" | Out-File $env:GITHUB_ENV -Append
          Write-Host "Project: $project"

      - name: Install dependencies
        shell: pwsh
        working-directory: ${{ env.PROJECT_DIR }}
        run: pnpm install --no-frozen-lockfile

      - name: Build Windows installer
        shell: pwsh
        working-directory: ${{ env.PROJECT_DIR }}
        run: pnpm --filter @workspace/makhzani-pos desktop:dist

      - name: Verify installer
        shell: pwsh
        run: |
          $release = Join-Path $env:PROJECT_DIR "artifacts/makhzani-pos/release"

          if (-not (Test-Path $release)) {
            throw "Release folder was not created."
          }

          $installers = @(
            Get-ChildItem $release -Filter "*.exe" -File |
            Where-Object { $_.Name -match 'setup|install' }
          )

          if ($installers.Count -eq 0) {
            Get-ChildItem $release -Recurse -File |
              Select-Object FullName, Length
            throw "Windows Setup EXE was not generated."
          }

          $output = Join-Path $env:GITHUB_WORKSPACE "installer-output"
          New-Item -ItemType Directory -Force $output | Out-Null

          foreach ($file in $installers) {
            if ($file.Length -lt 1MB) {
              throw "Installer file is unexpectedly small."
            }
            Copy-Item $file.FullName $output -Force
            Write-Host "Verified: $($file.Name)"
          }

      - name: Upload Windows Setup
        uses: actions/upload-artifact@v4
        with:
          name: Makhzani-POS-V8.1-Windows-Setup
          path: installer-output/*.exe
          if-no-files-found: error
          retention-days: 30
